[package]
name = "pasta-app"
description = "Pasta: clipboard sync across your devices over Tailscale"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pasta_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Keep on the same minor as @tauri-apps/api and @tauri-apps/cli in package.json:
# `tauri build` refuses to run when they differ.
tauri = { version = "~2.12", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-single-instance = "2"
os_info = { version = "3", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber.workspace = true
pasta-core.workspace = true
pasta-clipboard.workspace = true
pasta-crypto.workspace = true
pasta-net.workspace = true
pasta-store.workspace = true
uuid.workspace = true
zeroize.workspace = true
# Plugins stay on the 2.x line with tauri; their 3.0 alphas need tauri 3.
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
# TypeScript types for the IPC views, written by `cargo test` (#28).
ts-rs = "12"
base64.workspace = true
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# The clipboard panel's NSPanel (#38).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPanel", "NSWindow", "NSResponder", "NSGraphics"] }

# Repairs the Open at login entry before the single-instance plugin can exit (#47).
# The same crate and version tauri-plugin-autostart writes the entry with.
[target.'cfg(windows)'.dependencies]
auto-launch = "0.6"

# KDE's tray icon (#53): a StatusNotifierItem that reports left clicks. zbus
# stays on its async-io executor, like the Secret Service store's.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
gtk = "0.18"
zbus = { version = "5", default-features = false, features = ["async-io"] }

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
