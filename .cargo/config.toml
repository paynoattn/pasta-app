# Signs the debug app with a stable certificate before it runs, if one is set up;
# otherwise a no-op. See scripts/macos-dev-runner.sh and docs/development.md.
[target.'cfg(target_os = "macos")']
runner = "scripts/macos-dev-runner.sh"

# TypeScript bindings for the IPC types (#28): `cargo test -p pasta-app` writes them here.
[env]
TS_RS_EXPORT_DIR = { value = "src/ipc/bindings", relative = true }
