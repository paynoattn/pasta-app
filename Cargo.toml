[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["paynoattn"]
repository = "https://github.com/paynoattn/pasta-app"
publish = false

[workspace.dependencies]
pasta-core = { path = "crates/pasta-core" }
pasta-net = { path = "crates/pasta-net" }
pasta-clipboard = { path = "crates/pasta-clipboard" }
pasta-crypto = { path = "crates/pasta-crypto" }
pasta-store = { path = "crates/pasta-store" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "net"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.11"
fastrand = "2"
tempfile = "3"
base64 = "0.22"
# Crypto: one RustCrypto generation (digest 0.11 / sha2 0.11) throughout.
bip39 = { version = "3", default-features = false }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
getrandom = "0.4"
hkdf = "0.13"
hmac = { version = "0.13", features = ["zeroize"] }
region = "4"
zeroize = { version = "1.9", features = ["derive"] }
subtle = "2.6"
libc = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

# Profiles only take effect at the workspace root.
# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
