[package]
name = "pasta-app"
description = "Pasta: clipboard sync across your devices over Tailscale"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pasta_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Keep on the same minor as @tauri-apps/api and @tauri-apps/cli in package.json:
# `tauri build` refuses to run when they differ.
tauri = { version = "~2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
os_info = { version = "3", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber.workspace = true
pasta-core.workspace = true
pasta-clipboard.workspace = true
pasta-net.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
